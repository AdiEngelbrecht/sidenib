<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sidenib Peek app icon</title>
  <desc id="desc">An ivory note with a golden tab peeking from its right edge, on a softly rounded warm paper tile.</desc>
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <defs>
    <linearGradient id="tile" x1="176" y1="80" x2="818" y2="986" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9ED"/>
      <stop offset="1" stop-color="#EFDBAF"/>
    </linearGradient>
    <linearGradient id="paper" x1="242" y1="206" x2="684" y2="854" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF4"/>
      <stop offset="1" stop-color="#FFF4DD"/>
    </linearGradient>
    <linearGradient id="tab" x1="724" y1="420" x2="842" y2="628" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD45D"/>
      <stop offset="1" stop-color="#F6BE36"/>
    </linearGradient>
    <filter id="shadow" x="110" y="152" width="690" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="19" flood-color="#73501D" flood-opacity="0.19"/>
    </filter>
    <filter id="tab-shadow" x="670" y="392" width="202" height="288" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#916215" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="240" fill="url(#tile)"/>
  <rect x="32.75" y="32.75" width="958.5" height="958.5" rx="239.25" fill="none" stroke="#E0C99B" stroke-opacity="0.36" stroke-width="1.5"/>
  <rect x="702" y="412" width="144" height="224" rx="66" fill="url(#tab)" filter="url(#tab-shadow)"/>
  <rect x="182" y="194" width="554" height="652" rx="118" fill="#282722"/>
  <rect x="174" y="194" width="554" height="652" rx="118" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="175" y="195" width="552" height="650" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity="0.74" stroke-width="2"/>
</svg>
